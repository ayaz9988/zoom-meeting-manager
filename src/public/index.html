<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Manager</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4">Meeting Manager</h1>

        <!-- Create Meeting -->
        <div class="mb-5">
            <h3>Create Meeting</h3>
            <form id="meetingForm" class="row g-3 border p-3 bg-white">
                <div class="col-md-6">
                    <label for="topic" class="form-label">Topic (optional, default: 'New Meeting')</label>
                    <input type="text" class="form-control" id="topic" placeholder="Enter meeting topic">
                </div>
                <div class="col-md-6">
                    <label for="duration" class="form-label">Duration in minutes (optional, default: 30)</label>
                    <input type="number" class="form-control" id="duration" value="30" min="1">
                </div>
                <div class="col-md-6">
                    <label for="date" class="form-label">Meeting Date *</label>
                    <input type="date" class="form-control" id="date" required>
                </div>
                <div class="col-md-6">
                    <label for="startTime" class="form-label">Meeting Time *</label>
                    <input type="time" class="form-control" id="startTime" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-success">Create Meeting</button>
                </div>
            </form>
        </div>


        <!-- List Meetings -->
        <div class="mb-5">
            <h3>List Meetings</h3>
            <button class="btn btn-primary mb-3" onclick="loadMeetings()">Refresh Meetings</button>
            <div id="meetingsList" class="border p-3 bg-white">
                <p class="text-muted">Click "Refresh Meetings" to load your meetings</p>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
